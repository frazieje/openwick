# ---- Hardware ---------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_FPU=y
CONFIG_REBOOT=y

# ---- Settings persistence in the "storage" partition (NVS) ------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- Bluetooth LE peripheral ------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Pumpkin Candle"
# Appearance: light fixture
CONFIG_BT_DEVICE_APPEARANCE=1856
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SETTINGS=n
# Database Hash characteristic, so phones notice when the service table changes
# between firmware versions instead of showing a cached copy.
CONFIG_BT_GATT_CACHING=y
CONFIG_NRF_SECURITY=y
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Pumpkin Candle"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="OpenWick"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.2.0"

# ---- USB console: logging and a shell ---------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="candle:~$ "
CONFIG_SHELL_CMDS_RESIZE=n

